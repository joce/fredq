# Dependabot version updates.
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file
#
# Minor/patch bumps are grouped into a single PR per ecosystem; major bumps
# come as individual PRs so breaking changes stay isolated and reviewable.

version: 2
updates:
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "internal"
    groups:
      uv-dependencies:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "internal"
    groups:
      github-actions:
        patterns: ["*"]
        update-types: ["minor", "patch"]
