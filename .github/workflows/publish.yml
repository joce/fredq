# Release pipeline: pushing a `vX.Y.Z` tag runs everything below. The only
# manual step is approving the `pypi` environment deployment.
#
# This file name is registered as the PyPI Trusted Publisher; renaming it
# breaks publishing until the publisher on PyPI is updated to match.
name: Publish to PyPI

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.tag.outputs.version }}
    steps:
      - name: Check the tag format
        id: tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if [[ ! "$TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::Tag '$TAG' is not of the form vX.Y.Z"
            exit 1
          fi
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Check out the repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check the tagged commit is on main
        run: |
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Tag ${{ github.ref_name }} points at $GITHUB_SHA, which is not on main"
            exit 1
          fi

  checks:
    needs: validate
    uses: ./.github/workflows/ci.yml
    secrets: inherit

  build:
    needs: [validate, checks]
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history + tags so hatch-vcs derives the version

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "latest"
          python-version: "3.15"

      - name: Build distribution
        run: uv build

      - name: Check distribution metadata
        run: uvx twine check dist/*

      - name: Check the built version matches the tag
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          ls dist/
          compgen -G "dist/*-${VERSION}-*.whl" > /dev/null || { echo "::error::No wheel for version ${VERSION}"; exit 1; }
          compgen -G "dist/*-${VERSION}.tar.gz" > /dev/null || { echo "::error::No sdist for version ${VERSION}"; exit 1; }

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/fredq
    permissions:
      id-token: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    needs: [validate, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "Release $TAG already exists; uploading the distribution files to it."
            gh release upload "$TAG" dist/* --clobber
            exit 0
          fi

          notes="docs/release_${TAG}.md"
          if [[ -f "$notes" ]]; then
            echo "Using release notes from $notes"
            gh release create "$TAG" dist/* --verify-tag --title "$TAG" --notes-file "$notes"
            exit 0
          fi

          awk -v v="$VERSION" '
            index($0, "## [" v "]") == 1 { found = 1; next }
            found && /^## \[/ { exit }
            found && /^\[[^]]+\]: / { exit }
            found { print }
          ' CHANGELOG.md > "$RUNNER_TEMP/notes.md"

          if [[ -s "$RUNNER_TEMP/notes.md" ]] && grep -q '[^[:space:]]' "$RUNNER_TEMP/notes.md"; then
            echo "Using the CHANGELOG.md section for $VERSION"
            gh release create "$TAG" dist/* --verify-tag --title "$TAG" --notes-file "$RUNNER_TEMP/notes.md"
          else
            echo "::warning::No docs/release_${TAG}.md and no CHANGELOG.md section for ${VERSION}; using generated notes"
            gh release create "$TAG" dist/* --verify-tag --title "$TAG" --generate-notes
          fi
