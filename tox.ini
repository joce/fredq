[tox]
envlist = py{3.11,3.12,3.13,3.14,3.15}, spell, wheel
isolated_build = true
skip_missing_interpreters = true
requires = tox-uv >= 1.35

[gh-actions]
python =
    3.11: py3.11
    3.12: py3.12
    3.13: py3.13
    3.14: py3.14
    3.15: py3.15

[testenv]
description = Run checks for Python {envname}
runner = uv-venv-lock-runner
dependency_groups =
    dev
setenv =
    py3.11: PYRIGHT_PYTHON_VERSION = 3.11
    py3.12: PYRIGHT_PYTHON_VERSION = 3.12
    py3.13: PYRIGHT_PYTHON_VERSION = 3.13
    py3.14: PYRIGHT_PYTHON_VERSION = 3.14
    py3.15: PYRIGHT_PYTHON_VERSION = 3.15
commands =
    black --check --diff .
    ruff format --check --quiet --diff --target-version py311 .
    ruff check --target-version py311 .
    pyright --pythonversion {env:PYRIGHT_PYTHON_VERSION}
    python -m tools.check_no_skips -n auto

[testenv:check]
description = Run checks once on the current Python version
commands =
    black --check --diff .
    ruff format --check --quiet --diff --target-version py311 .
    ruff check --target-version py311 .
    pyright
    python -m tools.check_no_skips -n auto

[testenv:test]
description = Run only tests
commands =
    pytest

[testenv:pandas]
description = Run the pandas/pyarrow extra's tests, failing if any of them skip
extras =
    pandas
commands =
    python -m tools.check_no_skips tests/test_frames.py -q -rs

[testenv:spell]
description = Run spell check
skip_install = true
allowlist_externals =
    npm
commands =
    npm run spell

[testenv:wheel]
description = Smoke-test the installed wheel without source-tree imports
runner = uv-venv-runner
package = wheel
dependency_groups =
changedir = {env:TMPDIR:{env:TEMP:/tmp}}
allowlist_externals = uv
commands =
    uv run --no-project --python {envpython} python -I {toxinidir}/tools/check_wheel.py
    fredq --help

[testenv:windows]
description = Check Windows auth, file, bridge, and CLI behavior
commands =
    pytest tests/test_auth.py tests/test_client.py tests/test_bridge.py tests/test_parquet_writer.py tests/test_frames.py tests/test_hardening.py tests/test_skills_install.py tests/test_cli.py tests/test_cli_parquet.py tests/test_cli_skills.py

[testenv:coverage]
description = Run pytest with coverage reporting
dependency_groups =
    dev
setenv =
    COVERAGE_MINIMUM = 80
commands =
    pytest \
        --ignore-glob=**/integration/** \
        --cov=src \
        --cov-report=xml:coverage.xml \
        --cov-report=term-missing \
        --cov-fail-under={env:COVERAGE_MINIMUM} \
        --junitxml=junit.xml -o junit_family=legacy \
        {posargs}
